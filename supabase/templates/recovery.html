<h2>Reset your DE-app password</h2>
<p>Click the link below to choose a new password.</p>
<p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery&next=/auth/update-password">Choose a new password</a></p>
<p>If you didn't ask for this, you can ignore this email. Your password stays the same.</p>
